name: release

# Two steps, with a pull request between them. RELEASING.md ("Release a version") has the steps and the one-time setup.
#
# 1. A manual run (Actions > release > Run workflow) with `patch` (the default), `minor`, `major` or an exact version
#    X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in Directory.Build.props, dates the [Unreleased]
#    section of CHANGELOG.md and ships the public API of PublicAPI.Unshipped.txt (`release.py prepare`). A pull request
#    that GITHUB_TOKEN opens starts no workflow, so the run starts ci.yml on the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the version of Directory.Build.props has no
#    tag and CHANGELOG.md has its dated section (`release.py status`), the run waits for the ci.yml run of the merge
#    commit, pushes the package that this CI run built and tested to nuget.org with trusted publishing, and then creates
#    the tag vX.Y.Z and its GitHub release. A failed step publishes nothing after it; the tag comes last, so a re-run of
#    the failed jobs continues the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  VERSIONS_URL: https://api.nuget.org/v3-flatcontainer/agentcat/index.json

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set the version, date CHANGELOG.md and ship the public API
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/release.py prepare "$INPUT" "$(date -u +%F)")"
          # nuget.org never accepts a version twice, not even an unlisted one.
          if curl -sSf "$VERSIONS_URL" | jq -e --arg v "$version" '.versions | index($v)' > /dev/null; then
            echo "::error::nuget.org already has AgentCat $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Directory.Build.props CHANGELOG.md src/AgentCat/PublicAPI.Shipped.txt src/AgentCat/PublicAPI.Unshipped.txt
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          python3 .github/scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          {
            echo "Merging this pull request publishes \`AgentCat\` $VERSION to nuget.org, then tags \`v$VERSION\` and creates its GitHub release with these notes:"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file "$RUNNER_TEMP/body.md"
          gh workflow run ci.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A version to publish also needs an empty PublicAPI.Unshipped.txt and an AgentCat.Api pin past the one whose
      # Native AOT warnings the AOT job allows, or the step fails.
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          # The assignment, unlike a here-string, stops the step when the status step fails.
          result="$(python3 .github/scripts/release.py status)"
          read -r version action <<<"$result"
          echo "AgentCat $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    # The environment holds the NUGET_USER secret, admits only main, and is the one that the nuget.org trusted
    # publishing policy names.
    environment:
      name: release
      url: https://www.nuget.org/packages/AgentCat/${{ needs.status.outputs.version }}
    permissions:
      actions: read
      id-token: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The CI run of this push to main checks the commit on every OS and MCP version, and packs the package that its
      # aot and package-probe jobs test; the package goes out only when that run passes.
      - name: Wait for CI on this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r id status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.id // "none") \(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                echo "run=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      - name: Download the packages of that CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.ci.outputs.run }}
        run: |
          set -euo pipefail
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name packages --dir artifacts
          ls -l artifacts
          test -f "artifacts/AgentCat.$VERSION.nupkg"
          test -f "artifacts/AgentCat.$VERSION.snupkg"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Trusted publishing: nuget.org trades this job's OIDC token for an API key that is valid for one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name (not the email) of the account that owns AgentCat.
          user: ${{ secrets.NUGET_USER }}
      # A re-run after a push that went through skips the push. The push sends the .snupkg beside the .nupkg after it;
      # a re-run also skips a .nupkg that nuget.org has but does not list yet.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if curl -sSf "$VERSIONS_URL" | jq -e --arg v "$VERSION" '.versions | index($v)' > /dev/null; then
            echo "nuget.org already has AgentCat $VERSION"
            exit 0
          fi
          skip=()
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            skip=(--skip-duplicate)
          fi
          dotnet nuget push "artifacts/AgentCat.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json "${skip[@]}"

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
