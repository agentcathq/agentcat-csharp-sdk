name: release

# A v* tag publishes AgentCat: when the tag passes the checks of the verify job, the whole of ci.yml (every OS) runs,
# and only then do the packages it built and tested go to nuget.org and to a GitHub release. A tag that fails a check
# publishes nothing. RELEASING.md has the steps.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # The full history includes every branch as origin/*, so origin/main needs no fetch with credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "::error::The checkout has no origin/main"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      # The tag is v + the version that the pack uses (VersionPrefix and VersionSuffix in Directory.Build.props),
      # CHANGELOG.md has its dated section, the public API is shipped and AgentCat.Api is past the pin whose Native AOT
      # warnings the AOT job allows (.github/scripts/release.py).
      - name: Check the tag, CHANGELOG.md, the public API and the AgentCat.Api pin
        id: check
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/AgentCat/AgentCat.csproj -getProperty:PackageVersion)"
          python3 .github/scripts/release.py check "$GITHUB_REF_NAME" "$version"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment holds the NUGET_USER secret, admits only v* tags, and is the one the nuget.org trusted publishing
    # policy names.
    environment:
      name: release
      url: https://www.nuget.org/packages/AgentCat/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The packages that ci.yml's pack job built and its aot and package-probe jobs tested.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - name: The packages are the tagged version
        run: |
          set -euo pipefail
          ls -l artifacts
          test -f "artifacts/AgentCat.$VERSION.nupkg"
          test -f "artifacts/AgentCat.$VERSION.snupkg"
      # Trusted publishing: nuget.org trades this job's OIDC token for an API key that is valid for one hour, so the
      # key is requested right before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name (not the email) of the account that owns AgentCat.
          user: ${{ secrets.NUGET_USER }}
      # The push sends the .snupkg beside the .nupkg after it, but only when the .nupkg went through. On a first attempt,
      # a version that nuget.org already has fails the push, since this run did not put it there; a re-run skips the
      # .nupkg that an earlier attempt pushed (RELEASING.md says what to do about its symbols).
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          skip=()
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            skip=(--skip-duplicate)
          fi
          dotnet nuget push "artifacts/AgentCat.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json "${skip[@]}"

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Create the GitHub release, with the CHANGELOG.md section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "AgentCat $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "$RUNNER_TEMP/packages/AgentCat.$VERSION.nupkg" "$RUNNER_TEMP/packages/AgentCat.$VERSION.snupkg"
